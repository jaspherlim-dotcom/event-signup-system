<title>活动跟进后台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* 布局：手机 app 结构，深绿顶栏 + 白卡片 + 底部导航；联系人详情是全屏面板 */
:root{
  --brand:#0E5E3F; --brand-2:#13804F; --brand-soft:#E5F2EA; --on-brand:#FFFFFF;
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#16201B; --muted:#65726B; --line:#E0E6E2;
  --gold:#F2B33D; --gold-soft:#FFF3DA; --gold-ink:#8A5300;
  --red:#C4412D; --red-soft:#FCE9E5; --blue:#2F6FB5; --blue-soft:#E6F0FA;
  --font:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#1F8A5C; --brand-2:#27A06C; --brand-soft:#173327; --bg:#0E1512; --card:#18211D; --ink:#E7EEEA; --muted:#97A59D; --line:#26332D;
  --gold-soft:#3A2E14; --gold-ink:#F2C46A; --red-soft:#3A1C17; --blue-soft:#172838; color-scheme:dark }}
:root[data-theme="dark"]{
  --brand:#1F8A5C; --brand-2:#27A06C; --brand-soft:#173327; --bg:#0E1512; --card:#18211D; --ink:#E7EEEA; --muted:#97A59D; --line:#26332D;
  --gold-soft:#3A2E14; --gold-ink:#F2C46A; --red-soft:#3A1C17; --blue-soft:#172838; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding-bottom:96px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:linear-gradient(160deg,var(--brand),#0A4630);color:var(--on-brand);padding-block:18px 20px;border-radius:0 0 24px 24px;margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hrow h1{font-size:20px;font-weight:900;margin:0}
.hrow small{opacity:.8;font-size:13px}
.iconbtn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.tile{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 8px;text-align:center;cursor:pointer;border:0;color:#fff}
.tile b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;opacity:.85}
h2{font-size:17px;font-weight:900;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 8px}
.list{display:grid;gap:10px}
.item{background:var(--card);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;cursor:pointer;border:1px solid var(--line);text-align:left;width:100%}
.item:focus-visible,.btn:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.av{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:900}
.item .who{min-width:0}
.item .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .who small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap}
.p-new{background:var(--blue-soft);color:var(--blue)}
.p-wait{background:var(--brand-soft);color:var(--brand)}
.p-due{background:var(--gold-soft);color:var(--gold-ink)}
.p-late{background:var(--red-soft);color:var(--red)}
.p-done{background:var(--line);color:var(--muted)}
.p-paid{background:var(--brand);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.field{display:grid;gap:6px;font-size:14px;font-weight:500}
input,textarea,select{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--card);width:100%;min-width:0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-2);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:14px}
.btn.wa{background:#1FA855}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);line-height:1.7}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.banner{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px;line-height:1.6}
.banner.err{background:var(--red-soft);color:var(--red)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:9px 0 8px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ev .hd{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 14px;align-items:center}
.date{background:var(--brand);color:#fff;border-radius:12px;text-align:center;padding:8px 0}
.date b{display:block;font-size:22px;font-weight:900;line-height:1}
.date span{font-size:11px;letter-spacing:1px}
.ev .stats,.mcard .stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.ev .stats div,.mcard .stats div{padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.ev .stats b,.mcard .stats b{display:block;color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.ev .acts,.mcard .acts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 14px}
.link{font-size:13px;background:var(--bg);border-radius:10px;padding:8px 10px;word-break:break-all;margin:0 14px;user-select:all}
/* 详情面板 */
.panel{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-bottom:40px}
.panel .bar{position:sticky;top:0;z-index:2;background:var(--bg);padding-block:calc(env(safe-area-inset-top,0px) + 10px) 10px;display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.inner{max-width:720px;margin:0 auto}
.ncard{border-radius:20px;padding:20px;color:#fff;background:linear-gradient(140deg,#0E5E3F 0%,#13804F 60%,#2A9D63 100%);position:relative;overflow:hidden}
.ncard:after{content:"";position:absolute;right:-50px;top:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.ncard .nm{font-size:23px;font-weight:900}
.ncard .tt{opacity:.85}
.ncard .co{font-weight:700;margin-top:12px}
.ncard .ln{font-size:14px;opacity:.92;margin-top:3px;word-break:break-all;user-select:all}
.ncard .ft{margin-top:14px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.35);font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qa{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:12px}
.steps{display:grid;gap:0}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.step:not(:last-child):before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--line);color:var(--muted)}
.dot.ok{background:var(--brand);color:#fff}
.dot.due{background:var(--gold);color:#3b2600}
.dot.late{background:var(--red);color:#fff}
.step b{display:block}
.step .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mcard .acts{padding:0}
.mcard .av{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:900;font-size:18px}
.memo{border-left:3px solid var(--brand-soft);padding:2px 0 2px 12px;margin-bottom:12px}
.memo .k{font-size:12px;color:var(--muted)}
.memo p{margin:3px 0 0;white-space:pre-wrap;line-height:1.6}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--brand)}
.ai{background:linear-gradient(180deg,var(--brand-soft),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ai ol{margin:6px 0 0;padding-left:20px;line-height:1.7}
.ai .draft{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;line-height:1.6;margin-top:8px}
.heat{display:flex;gap:8px}
.stack{display:grid;gap:12px}
.arow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.arow .who{min-width:0}.arow .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arow .who small{color:var(--muted);font-size:12px}
.arow .acts{display:flex;gap:6px}
.ci{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.ci.in{border-color:var(--brand);background:var(--brand-soft)}
.cibtn{min-width:92px;padding:12px 14px;font-size:15px}
.qr{background:#fff;padding:12px;border-radius:14px;display:inline-grid;place-items:center;border:1px solid var(--line)}
.qr img,.qr canvas{display:block;max-width:100%;height:auto}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;min-width:560px}
.tbl th,.tbl td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal;min-width:140px}
.tbl th{color:var(--muted);font-weight:500;font-size:12px}
.funnel{display:grid;gap:8px}
.fbar{display:grid;grid-template-columns:64px 1fr 72px;gap:10px;align-items:center;font-size:13px}
.fbar .track{height:22px;background:var(--bg);border-radius:6px;overflow:hidden}
.fbar .fill{height:100%;background:var(--brand-2);border-radius:6px;min-width:2px}
.fbar b{text-align:right;font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big .box b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.big .box span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.big{grid-template-columns:repeat(2,1fr)}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}.qa{grid-template-columns:1fr 1fr}.qa .btn.wa{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.item,.tile{transition:transform .12s}.item:active,.tile:active{transform:scale(.985)}}
</style>

<div class="app" id="app">
  <header class="top gut">
    <div class="hrow"><div><h1>活动跟进后台</h1><small id="sub">只有你看得到这一页</small></div>
      <button class="iconbtn" id="refresh" type="button" aria-label="重新读取报名资料">↻ 刷新</button></div>
    <div class="tiles" id="tiles"></div>
  </header>
  <main class="gut" id="main"><div class="empty" style="margin-top:16px">正在连接资料库…</div></main>
</div>
<nav class="tabs" aria-label="主导航"><div class="in" id="tabs"></div></nav>
<div id="panelHost"></div>

<script>
// ===== 基本工具 =====
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 86400000;
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const sod = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const fmtD = t => { const d = new Date(t); return `${d.getDate()}/${d.getMonth()+1}`; };
const fmtDT = t => { const d = new Date(t); return `${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
function toast(m){ const t = document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function waNum(p){ let d = String(p||'').replace(/\D/g,''); if (d.startsWith('0')) d = '6' + d; else if (/^1\d{8,9}$/.test(d)) d = '60' + d; return d; }
function waLink(p, text){ return `https://wa.me/${waNum(p)}${text ? '?text=' + encodeURIComponent(text) : ''}`; }
function parseDate(s){ const m = String(s||'').match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast('已复制'); } catch(_) { toast('复制不了，请长按文字手动复制'); } }

const DEFAULT_T = {
  t1: '你好 {name}，我是 Jaspher。谢谢你报名「{event}」！想跟你确认一下出席，也想了解你这次最想收获什么？\n\n你的入场卡（活动当天出示二维码签到）：{ticket}',
  t4: 'Hi {name}，上次跟你聊到「{event}」，想跟进一下你那边考虑得怎样？有什么问题我可以帮你解答。',
  t7: '{name} 你好，最后跟进一下「{event}」。如果现在时机不对也没关系，之后有合适的活动我再通知你。',
  t0: 'Hi {name}，提醒你明天的「{event}」：\n日期：{date} {time}\n地点：{venue}\n地图：{map}\n入场卡：{ticket}\n到时见！有任何问题随时 WhatsApp 我。',
  tt: '{name}，谢谢你今天来「{event}」！花1分钟帮我填个简单问卷，让下一场做得更好：\n{link}'
};
const TPL_NAMES = { t1:'第1天 · 首次联系', t4:'第4天 · 跟进', t7:'第7天 · 最后跟进', t0:'活动前提醒', tt:'会后感谢 + 问卷' };
const DEALS = ['潜在','洽谈中','已成交','流失'];
const SOURCES = [['fb','Facebook'],['wa','WhatsApp群'],['ig','Instagram'],['xhs','小红书'],['ref','朋友介绍'],['email','电邮']];
const SRC_NAME = Object.assign(Object.fromEntries(SOURCES), { card:'邀请卡', walkin:'现场报名' });

// ===== 状态 =====
const S = { tab:'today', filter:'全部', evFilter:'', refFilter:'', q:'', team:[], tlogs:{}, teamAI:null, teamAIBusy:false, cfg:{}, crm:{}, events:[], regs:[], feedback:[], sub:null, ciq:'', loaded:false, sheetErr:'', db:null, mcp:null, sample:null, open:null, dbReady:false };
const tpl = k => (S.cfg.templates && S.cfg.templates[k]) || DEFAULT_T[k];
function fill(t, r){
  const ev = S.events.find(e => e.id === r.eventId) || {};
  const map = { name:r.name, event:r.eventName || ev.name, date:ev.date, time:ev.time, venue:ev.venue, map:mapLink(ev), link:fbUrl(r.eventId), ticket:ticketUrl(r) };
  return t.replace(/\{(name|event|date|time|venue|map|link|ticket)\}/g, (_, k) => map[k] || '');
}
const pkey = p => waNum(p).slice(-9);
function history(r){ const k = pkey(r.phone); return S.regs.filter(x => x.id !== r.id && pkey(x.phone) === k); }
function fbFor(r){ const k = pkey(r.phone); return S.feedback.filter(f => f.eventId === r.eventId && pkey(f.phone) === k); }
function isAtt(id){ const c = S.crm[id] || {}; if (c.attended !== undefined) return !!c.attended; const r = S.regs.find(x => x.id === id); return !!(r && r.checkin); }
function checkinText(r){ const c = S.crm[r.id] || {}; return c.checkinAt ? fmtDT(c.checkinAt) : (r.checkin ? r.checkin.slice(5,16) : ''); }
function ticketUrl(r){ return baseUrl() && r.key ? baseUrl() + '?t=' + encodeURIComponent(r.id) + '&k=' + encodeURIComponent(r.key) : ''; }
function mapLink(e){ return /^https:\/\//.test(e.mapUrl||'') ? e.mapUrl : (e.venue ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.venue) : ''); }
function baseUrl(){ return S.cfg.webAppUrl ? S.cfg.webAppUrl.replace(/[?#].*$/,'') : ''; }
function fbUrl(evId){ return baseUrl() ? baseUrl() + '?f=' + encodeURIComponent(evId) : ''; }
function money(n){ return 'RM ' + (Math.round(n) || 0).toLocaleString('en-MY'); }
const num = v => parseFloat(String(v||'').replace(/[^\d.]/g,'')) || 0;
// ===== 团队 =====
const member = code => S.team.find(m => m.code === code);
const refName = r => { const m = r.ref && member(r.ref); return m ? m.name : (r.ref || ''); };
const teamUrl = () => baseUrl() ? baseUrl() + '?team' : '';
const refUrl = (e, code) => baseUrl() ? baseUrl() + '?e=' + encodeURIComponent(e.id) + '&r=' + encodeURIComponent(code) : '';
const tlogsOf = id => (S.tlogs[id] || []).filter(l => l.kind !== 'AI建议');
function memberStats(code){
  const rs = S.regs.filter(r => r.ref === code), c = r => S.crm[r.id] || {};
  return { n:rs.length, contacted:rs.filter(r => fu(r).firstAt).length,
    att:rs.filter(r => isAtt(r.id)).length, paid:rs.filter(r => c(r).paid).length, won:rs.filter(r => c(r).deal==='已成交').length,
    rev:rs.reduce((t,r) => t + (c(r).paid ? num(c(r).payAmount) : 0), 0), deal:rs.reduce((t,r) => t + (c(r).deal==='已成交' ? num(c(r).dealValue) : 0), 0),
    notes:rs.reduce((t,r) => t + tlogsOf(r.id).length, 0) };
}

// ===== 147 法则 =====
// 第1天 = 首次联系当天；第4天 = 首次联系后 +3 天；第7天 = +6 天
// 推荐人在团队页记录的联系，也算进 147（避免你和成员重复联系）
const parseAt = v => { const m = String(v||'').match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/); return m ? new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0)).getTime() : 0; };
function teamAt(id, kind){ const t = (S.tlogs[id] || []).filter(l => l.kind === kind).map(l => parseAt(l.at)).filter(Boolean); return t.length ? Math.min.apply(null, t) : 0; }
function fu(r){ const c = S.crm[r.id] || {}; return { firstAt:c.firstAt || teamAt(r.id,'首次联系'), fu4At:c.fu4At || teamAt(r.id,'第4天跟进'), fu7At:c.fu7At || teamAt(r.id,'第7天跟进') }; }
function stage(r){
  const c = fu(r);
  const today = sod(Date.now());
  if (!c.firstAt) return { key:'new', label:'未联系', cls:'p-new', due:false, rank:1 };
  const d4 = sod(c.firstAt) + 3*DAY, d7 = sod(c.firstAt) + 6*DAY;
  if (!c.fu4At){
    if (today > d4) return { key:'fu4', label:`第4天跟进 · 逾期${Math.round((today-d4)/DAY)}天`, cls:'p-late', due:true, rank:0, dueAt:d4 };
    if (today === d4) return { key:'fu4', label:'今天跟进（第4天）', cls:'p-due', due:true, rank:0, dueAt:d4 };
    return { key:'wait4', label:`${fmtD(d4)} 第4天跟进`, cls:'p-wait', due:false, rank:2, dueAt:d4 };
  }
  if (!c.fu7At){
    if (today > d7) return { key:'fu7', label:`第7天跟进 · 逾期${Math.round((today-d7)/DAY)}天`, cls:'p-late', due:true, rank:0, dueAt:d7 };
    if (today === d7) return { key:'fu7', label:'今天跟进（第7天）', cls:'p-due', due:true, rank:0, dueAt:d7 };
    return { key:'wait7', label:`${fmtD(d7)} 第7天跟进`, cls:'p-wait', due:false, rank:2, dueAt:d7 };
  }
  return { key:'done', label:'147 完成', cls:'p-done', due:false, rank:3 };
}

// ===== 资料读取 =====
function vals(res){ const p = res && res.payload; if (!p) return []; return p.values || (p.content && p.content.values) || []; }
async function loadSheet(force){
  if (!S.cfg.sheetId){ S.loaded = true; render(); return; }
  if (!S.mcp){ S.sheetErr = '没办法连到 Google Sheets。请确认 Claude 已连接 Google Sheets，然后刷新这页。'; S.loaded = true; render(); return; }
  const opts = force ? { cache:{ refresh:true } } : { cache:{ staleTime:60000, gcTime:600000 } };
  try {
    const [e, r] = await Promise.all([
      S.mcp.callTool('Google Sheets','get_values',{ spreadsheetId:S.cfg.sheetId, range:'Events!A2:M' }, opts),
      S.mcp.callTool('Google Sheets','get_values',{ spreadsheetId:S.cfg.sheetId, range:'Registrations!A2:O' }, opts)
    ]);
    S.events = vals(e).map((x,i) => ({ row:i+2, id:x[0], name:x[1]||'', date:x[2]||'', time:x[3]||'', venue:x[4]||'', desc:x[5]||'', fee:x[6]||'', cover:x[7]||'', status:x[8]||'开放', created:x[9]||'', cap:parseInt(x[10],10)||0, mapUrl:x[11]||'', contact:(x[12]||'').replace(/[^\d+]/g,'') })).filter(x => x.id);
    S.regs = vals(r).map(x => ({ id:x[0], at:x[1]||'', eventId:x[2]||'', eventName:x[3]||'', name:x[4]||'', company:x[5]||'', title:x[6]||'', phone:x[7]||'', email:x[8]||'', industry:x[9]||'', note:x[10]||'', source:x[11]||'', checkin:x[12]||'', key:x[13]||'', ref:String(x[14]||'').toUpperCase() })).filter(x => x.id && /^[A-Za-z0-9_-]+$/.test(x.id)).reverse();
    S.sheetErr = '';
    try {
      const f = await S.mcp.callTool('Google Sheets','get_values',{ spreadsheetId:S.cfg.sheetId, range:'Feedback!A2:I' }, opts);
      S.feedback = vals(f).map(x => ({ at:x[0]||'', eventId:x[1]||'', eventName:x[2]||'', name:x[3]||'', phone:x[4]||'', rating:+x[5]||0, gain:x[6]||'', improve:x[7]||'', next:x[8]||'' })).filter(x => x.eventId);
    } catch(_) { S.feedback = []; }
    try {
      const [tm, tf] = await Promise.all([
        S.mcp.callTool('Google Sheets','get_values',{ spreadsheetId:S.cfg.sheetId, range:'Team!A2:F' }, opts),
        S.mcp.callTool('Google Sheets','get_values',{ spreadsheetId:S.cfg.sheetId, range:'TeamFollow!A2:E' }, opts)
      ]);
      S.team = vals(tm).map((x,i) => ({ row:i+2, code:String(x[0]||'').trim().toUpperCase(), name:x[1]||'', phone:x[2]||'', pin:String(x[3]||''), active:String(x[4]||'').trim() !== '停用', created:x[5]||'' })).filter(m => m.code);
      const tl = {}; vals(tf).forEach(x => { if (x[1]) (tl[x[1]] = tl[x[1]] || []).push({ at:x[0]||'', code:String(x[2]||'').toUpperCase(), kind:x[3]||'', text:x[4]||'' }); });
      S.tlogs = tl;
    } catch(_) { S.team = []; S.tlogs = {}; }
  } catch(err){
    S.sheetErr = err && err.code === 'not_granted' ? '你还没允许这页使用 Google Sheets。按「刷新」再试，出现提示时选允许。' : `读取报名表失败（${esc(err && (err.code || err.message) || '未知')}）。按「刷新」再试。`;
  }
  S.loaded = true; render();
}

const chains = {};
function saveCrm(id, patch){
  S.crm[id] = Object.assign({}, S.crm[id] || {}, patch, { updatedAt: Date.now() });
  const data = S.crm[id];
  render();
  chains[id] = (chains[id] || Promise.resolve()).then(() => S.db.doc('crm/' + id).set(data)).catch(() => toast('保存失败，请检查网络'));
  return chains[id];
}
function addMemo(id, kind, text, extra){
  const c = S.crm[id] || {};
  const memos = (c.memos || []).concat([{ at: Date.now(), kind, text: (text||'').trim() }]);
  return saveCrm(id, Object.assign({ memos }, extra || {}));
}

${lines}

只回 JSON：{"summary":"两三句总结","steps":["下一步1","下一步2","下一步3"],"members":[{"name":"成员名","advice":"一句建议"}]}`;

function genCode(name){
  let base = String(name||'').replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,4);
  if (base.length < 2) base = 'T';
  let code;
  do { code = base + String(Math.floor(Math.random()*90 + 10)); } while (S.team.some(m => m.code === code));
  return code;
}

async function exportCsv(){

  const d = t => t ? new Date(t).toISOString().slice(0,10) : '';
  const rows = list.map(r => { const c = S.crm[r.id]||{}, f = fbFor(r)[0] || {}, m = (c.memos||[]).slice(-1)[0];
    return [r.id, r.at, r.eventName, r.name, r.company, r.title, r.phone, r.email, r.industry, SRC_NAME[r.source]||r.source, stage(r).label, d(fu(r).firstAt), d(fu(r).fu4At), d(fu(r).fu7At), c.heat||'', c.deal||'', c.dealValue||'', c.paid?'是':'否', c.payAmount||'', c.paid?(c.payMethod||''):'', isAtt(r.id)?'是':'否', f.rating||'', f.next||'', m ? m.text : '', refName(r), (tlogsOf(r.id).slice(-1)[0]||{}).text||'']; });
  const cell = v => { let s = String(v == null ? '' : v); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const csv = '﻿' + [H].concat(rows).map(r => r.map(cell).join(',')).join('\r\n');
  if (!S.downloads){ copy(csv); toast('这里不能下载，已复制成 CSV 文字'); return; }
  try { await S.downloads.save({ filename:`活动名单_${new Date().toISOString().slice(0,10)}.csv`, data:new Blob([csv], { type:'text/csv' }) }); }
  catch(err){ if (err && err.code !== 'cancelled' && err.code !== 'declined') toast('下载失败'); }
}

// ===== 邀请卡（图片）=====
function wrapText(ctx, text, maxW, maxLines){
  const out = []; let line = '';
  for (const ch of String(text||'').replace(/\s+/g,' ')){
    const t = line + ch;
    if (ctx.measureText(t).width > maxW && line){ out.push(line); line = ch.trim() ? ch : ''; if (out.length === maxLines) break; }
    else line = t;
  }
  if (out.length < maxLines && line) out.push(line);
  else if (out.length === maxLines && line){ let l = out[maxLines-1]; while (ctx.measureText(l + '…').width > maxW && l) l = l.slice(0,-1); out[maxLines-1] = l + '…'; }
  return out;
}

  if (ev.contact) rows.push(['联系', ev.contact]);
  rows.forEach(([k,v]) => {
    ctx.font = `500 30px ${F}`; ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.fillText(k, 80, y);
    ctx.font = `700 38px ${F}`; ctx.fillStyle = '#fff'; ctx.fillText(wrapText(ctx, v, W-260, 1)[0] || '', 180, y);
    y += 66;
  });
  // 简介
  const by = H - 330;
  const room = Math.min(3, Math.floor((by - 40 - (y + 10)) / 46));
  if (ev.desc && room > 0){ y += 10; ctx.font = `400 30px ${F}`; ctx.fillStyle = 'rgba(255,255,255,.85)';
    wrapText(ctx, ev.desc, W-160, room).forEach(l => { ctx.fillText(l, 80, y); y += 46; }); }
  // 底部白卡 + 二维码
  ctx.fillStyle = '#fff'; roundRect(ctx, 60, by, W-120, 270, 36); ctx.fill();
  const url = shareUrl(ev, 'card');
  const qs = 210, qx = W - 60 - 30 - qs, qy = by + 30;
  if (url && typeof QRCode !== 'undefined'){
    const tmp = document.createElement('div'); new QRCode(tmp, { text:url, width:qs, height:qs, colorDark:'#0E5E3F', correctLevel:QRCode.CorrectLevel.M });
    const src = tmp.querySelector('canvas'); if (src) ctx.drawImage(src, qx, qy, qs, qs);
  } else { ctx.strokeStyle = '#ccd'; ctx.setLineDash([10,8]); ctx.strokeRect(qx, qy, qs, qs); ctx.setLineDash([]); }
  ctx.fillStyle = '#16201B'; ctx.font = `900 46px ${F}`; ctx.fillText('扫码立即报名', 110, by + 105);
  ctx.font = `400 28px ${F}`; ctx.fillStyle = '#65726B';
  ctx.fillText(url ? '报名后会收到个人入场卡' : '（报名链接设定后会显示二维码）', 110, by + 160);
  ctx.fillText('活动当天出示入场卡二维码签到', 110, by + 205);
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
async function saveInvite(ev){
  const cv = document.getElementById('inviteCv'); if (!cv) return;
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!S.downloads || !blob){ toast('这里不能下载，请长按图片保存或截图'); return; }
  try { await S.downloads.save({ filename:`邀请卡_${ev.name.slice(0,20)}.png`, data:blob }); } catch(_) {}
}

// ===== 给 AI Agent 的活动资料包 =====
function agentBrief(ev){
  const st = evStats(ev.id);
  const links = { register: shareUrl(ev) || null, channels: Object.fromEntries(SOURCES.map(([k]) => [k, shareUrl(ev,k) || null])), feedback: fbUrl(ev.id) || null };
  const promo = `【${ev.name}】\n📅 ${ev.date} ${ev.time}\n📍 ${ev.venue}\n${ev.fee ? '💰 ' + ev.fee + '\n' : ''}${ev.cap ? '👥 限 ' + ev.cap + ' 位\n' : ''}${mapLink(ev) ? '🗺 地图：' + mapLink(ev) + '\n' : ''}${ev.contact ? '📞 询问：' + ev.contact + '\n' : ''}${ev.desc ? '\n' + ev.desc + '\n' : ''}\n立即报名 👉 ${links.register || '（报名链接待设定）'}`;
  const data = { type:'event_brief', version:1, event:{ id:ev.id, name:ev.name, date:ev.date, time:ev.time, venue:ev.venue, fee:ev.fee || '免费', capacity:ev.cap || null, seats_left: ev.cap ? Math.max(0, ev.cap - st.n) : null, map:mapLink(ev) || null, contact_phone:ev.contact || null, contact_whatsapp: ev.contact ? 'https://wa.me/' + waNum(ev.contact) : null, description:ev.desc, status:ev.status==='关闭'?'closed':'open' },
    links, stats:{ registered:st.n, contacted:st.contacted, paid:st.paid, attended:st.att }, organizer:'Jaspher',
    channel_codes: Object.fromEntries(SOURCES) };
  return `# 活动资料包：${ev.name}

你是协助 Jaspher 推广这场活动的助手。以下资料是准确的，请只用这里的资料，不要自己编日期、价格、讲者或优惠。

## 活动资料
- 活动ID：${ev.id}
- 名称：${ev.name}
- 日期：${ev.date}
- 时间：${ev.time || '待定'}
- 地点：${ev.venue || '待定'}
- 费用：${ev.fee || '免费'}
- 名额：${ev.cap ? `限 ${ev.cap} 位，目前剩 ${Math.max(0, ev.cap - st.n)} 位${st.n >= ev.cap ? '（已额满，不要再邀请人报名）' : ''}` : '不限'}
- 地图：${mapLink(ev) || '（没有）'}
- 主办方联系：${ev.contact ? `${ev.contact}（WhatsApp：https://wa.me/${waNum(ev.contact)}）` : '（没有）'}
- 报名状态：${ev.status === '关闭' ? '已关闭，不要再邀请人报名' : '开放中'}
${ev.desc ? `\n## 活动介绍\n${ev.desc}\n` : ''}
## 链接
- 通用报名链接：${links.register || '（还没设定）'}
${SOURCES.map(([k,l]) => `- ${l}专用：${links.channels[k] || '（还没设定）'}`).join('\n')}
- 会后问卷（活动结束后才发）：${links.feedback || '（还没设定）'}

## 怎么用
1. 发到哪个渠道，就用那个渠道的专用链接，这样可以追踪报名来源。
2. 报名的人会自动收到个人入场卡（带签到二维码），不用另外发。
3. 语气：马来西亚华人口语，亲切、专业、不夸张。不要用"保证赚钱"、"名额只剩最后几个"之类没根据的话。
4. 有人问到资料里没有的问题（例如讲者背景、退款、团体价），请回答"我帮你问 Jaspher"，不要自己回答。
5. 不要收集或转发任何报名者的个人资料。

## 参考宣传文案
${promo}

## 目前进度（${new Date().toISOString().slice(0,10)}）
报名 ${st.n} 人 · 已联系 ${st.contacted} · 已付款 ${st.paid} · 出席 ${st.att}

## 机器可读资料（JSON）
\`\`\`json
${JSON.stringify(data, null, 2)}
\`\`\`
`;
}
async function saveBrief(ev){
  const text = agentBrief(ev);
  if (!S.downloads){ copy(text); return; }
  try { await S.downloads.save({ filename:`活动资料包_${ev.id}.md`, data:new Blob([text], { type:'text/markdown' }) }); } catch(_) {}
}

    <p class="note" style="margin:0">每位成员的专属链接。成员自己登入团队页也拿得到。</p>

async function runAI(r){
  if (!S.sample || S.aiBusy) return;
  const c = S.crm[r.id] || {}, s = stage(r), ev = S.events.find(e => e.id === r.eventId) || {};
  S.aiBusy = true; S.aiErr = ''; renderPanel();
  const memos = (c.memos||[]).map(m => `- ${new Date(m.at).toISOString().slice(0,10)} [${m.kind}] ${m.text||'(没写内容)'}`).join('\n') || '(还没有备忘录)';
  const prompt = `你是一位马来西亚的资深业务教练，帮一位企业家（活动主办人 Jaspher）跟进活动报名者。他用"147法则"：首次联系后第4天、第7天再跟进。
请根据以下资料，判断这个人目前的意向，并给出具体可执行的下一步。语气用马来西亚华人自然口语，简洁实用，不要夸张。

【活动】${ev.name||r.eventName}｜日期 ${ev.date||'-'}｜费用 ${ev.fee||'-'}
【报名者】姓名 ${r.name}｜公司 ${r.company||'-'}｜职位 ${r.title||'-'}｜行业 ${r.industry||'-'}
【报名时写的】${r.note||'-'}
【目前阶段】${s.label}｜已付款：${c.paid?'是':'否'}｜已出席：${isAtt(r.id)?'是':'否'}｜意向标记：${c.heat||'未标'}
【成交管道】${c.deal||'潜在'}｜金额 ${c.dealValue||'-'}｜产品 ${c.dealWhat||'-'}
【会后问卷】${fbFor(r).map(f => `评分${f.rating}/5；收获：${f.gain||'-'}；建议：${f.improve||'-'}；想要：${f.next||'-'}`).join(' / ') || '(没填)'}
【推荐人跟进】${r.ref ? refName(r) + '：' + (tlogsOf(r.id).map(l => `${String(l.at).slice(0,10)} [${l.kind}] ${l.text||'(没写)'}`).join('；') || '还没记录') : '没有推荐人'}
【参加历史】${history(r).map(h => h.eventName + (isAtt(h.id)?'(出席)':'') + ((S.crm[h.id]||{}).paid?'(已付)':'')).join('、') || '第一次报名'}
【备忘录（时间顺序）】
${memos}

只回 JSON，格式：{"summary":"一两句总结目前情况","intent":"热/温/冷 + 一句原因","steps":["下一步1","下一步2","下一步3"],"message":"一段可以直接发 WhatsApp 的讯息，用对方名字，80字以内"}`;
  try {
    const out = await S.sample.json(prompt, { modelTier:'default' });
    const ai = { at:Date.now(), summary:String(out.summary||''), intent:String(out.intent||''), steps:(Array.isArray(out.steps)?out.steps:[]).slice(0,5).map(String), message:String(out.message||'') };
    S.aiBusy = false;
    saveCrm(r.id, { ai });
  } catch(err){
    S.aiBusy = false;
    S.aiErr = err && err.code === 'not_granted' ? '你没有允许这页使用 AI。' : err && err.code === 'rate_limited' ? 'AI 使用次数暂时到顶，迟点再试。' : 'AI 分析失败，请再试一次。';
    renderPanel();
  }
}

(async () => {
  const [db, mcp, sample, downloads] = await Promise.all([claude.use('db'), claude.use('mcp'), claude.use('sample'), claude.use('downloads')]);
  S.db = db; S.mcp = mcp; S.sample = sample; S.downloads = downloads;
  if (!db){ $('#main').innerHTML = '<div class="banner err">资料库连接不到。请用你自己的 Claude 账号登录后打开这一页。</div>'; return; }
  let gotCfg = false, gotCrm = false;
  const timer = setTimeout(() => { if (!S.dbReady) $('#main').innerHTML = '<div class="banner err">资料库暂时连不到，请检查网络，稍后会自动再试。</div>'; }, 10000);
  const ready = () => { if (gotCfg && gotCrm && !S.dbReady){ S.dbReady = true; clearTimeout(timer); render(); loadSheet(false); } };
  db.doc('config/main').onSnapshot(snap => {
    const prevSheet = S.cfg.sheetId;
    S.cfg = snap.exists ? (snap.data() || {}) : {};
    if (S.cfg.teamAI && !S.teamAI) S.teamAI = S.cfg.teamAI;
    gotCfg = true; ready();
    if (S.dbReady && prevSheet !== undefined && prevSheet !== S.cfg.sheetId) loadSheet(true);
  }, () => { gotCfg = true; ready(); });
  db.collection('crm').onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data() || {}; });
    for (const id in S.crm){ if (chains[id] && !m[id]) m[id] = S.crm[id]; }
    S.crm = m; gotCrm = true; ready();
    const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#main form');
    if (S.dbReady && !typing) render();
  }, () => { gotCrm = true; ready(); });
})();
