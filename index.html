<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>活动报名系统</title>
<script src="config.js"></script>
<script>
  if (window.SYSTEM_URL && /^https:\/\/script\.google\.com\//.test(window.SYSTEM_URL)) location.replace(window.SYSTEM_URL + location.search);
</script>
<style>
  :root{--brand:#0E5E3F;--bg:#F4F6F5;--card:#fff;--ink:#16201B;--muted:#5E6B64;color-scheme:light}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
  .w{max-width:560px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
  h1{margin:0;font-size:24px}.c{background:var(--card);border-radius:18px;padding:18px;line-height:1.7}
  a.b{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 18px}
  p{margin:0;color:var(--muted)}
</style></head>
<body><div class="w">
  <h1>活动报名 + 147 跟进系统</h1>
  <div class="c"><p>系统还没连上。部署好 Google Apps Script 之后，把网页应用网址填进仓库里的 <b>config.js</b>，这个网址就会直接打开报名系统。</p></div>
  <div class="c"><p style="margin-bottom:10px">先看看示范版：</p><a class="b" href="demo/">打开 Demo</a></div>
</div></body></html>
